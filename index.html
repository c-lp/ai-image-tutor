<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Kaylee Oh — AI Image Tutor / Visual Content Specialist</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Kaylee (Hakyoung) Oh — AI Image Tutor and Visual Content Specialist. I teach AI to see." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Caveat:wght@400;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="content.jsx"></script>
  <script type="text/babel" src="covers.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    const { useState, useEffect } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "mode": "light",
      "accent": "medium",
      "heroLayout": "photo",
      "gridDensity": "loose"
    }/*EDITMODE-END*/;

    function App() {
      const [lang, setLang] = useState("en");
      const [tweaks, setTweak] = window.useTweaks(TWEAK_DEFAULTS);

      const content = window.CONTENT[lang];

      // apply theme + accent + density at root
      useEffect(() => {
        document.documentElement.setAttribute("data-theme", tweaks.mode === "dark" ? "dark" : "light");
        document.documentElement.setAttribute("data-accent", tweaks.accent);
      }, [tweaks.mode, tweaks.accent]);

      // Light/Dark presets — bundle the full look
      const setMode = (next) => {
        if (next === "dark") {
          setTweak({ mode: "dark", accent: "soft", heroLayout: "photo", gridDensity: "loose" });
        } else {
          setTweak({ mode: "light", accent: "medium", heroLayout: "photo", gridDensity: "loose" });
        }
      };

      window.useScrollReveal();
      const scrollP = window.useScrollProgress();

      // accent hex for inline style usage
      const accent = ({
        soft: "#C5564A",
        medium: "#B91C1C",
        strong: "#8B0000",
      })[tweaks.accent] || "#B91C1C";

      return (
        <>
          <window.TopChrome lang={lang} setLang={setLang} content={content} scrollP={scrollP} mode={tweaks.mode} setMode={setMode} />

          <window.Hero content={content} layout={tweaks.heroLayout} accent={accent} />
          <window.Marquee items={content.marquee} />
          <window.About content={content} />
          <window.Work content={content} accent={accent} density={tweaks.gridDensity} lang={lang} />
          <window.Method content={content} accent={accent} />
          <window.Experience content={content} accent={accent} />
          <window.Creator content={content} accent={accent} />
          <window.Contact content={content} accent={accent} />
          <window.Footer content={content} />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
